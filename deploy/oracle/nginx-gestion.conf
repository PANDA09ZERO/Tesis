# /etc/nginx/sites-available/gestion  — proxy inverso hacia la API (puerto 3000 local).
# Reemplazar API_DOMINIO por el dominio real (p. ej. gestion-tesis.duckdns.org).
# Certbot agrega después el bloque HTTPS (443) y la redirección desde HTTP.

server {
    listen 80;
    listen [::]:80;
    server_name API_DOMINIO;

    # Documentos de hasta 10 MB (MAX_UPLOAD_BYTES) más el margen del formulario.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Se SOBRESCRIBE (no se añade): un cliente no puede falsificar su IP
        # para esquivar el límite de intentos de inicio de sesión.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 130s;
        proxy_read_timeout 130s;
    }
}
