<div id="sub-g0" class="cap clip" data-start="1.62" data-duration="2.35"><span>Bienvenido a Ciencias e Ingeniería.</span></div>
<div id="sub-g1" class="cap clip" data-start="4.47" data-duration="5.65"><span>Notas, asistencia y horarios del año escolar, en un solo lugar.</span></div>
<div id="sub-g2" class="cap clip" data-start="12.54" data-duration="3.74"><span>Para empezar, abre el navegador en tu computadora o en tu celular,</span></div>
<div id="sub-g3" class="cap clip" data-start="16.3" data-duration="3.74"><span>y entra a la página de ingreso del sistema.</span></div>
<div id="sub-g4" class="cap clip" data-start="21.56" data-duration="2.24"><span>Escribe tu usuario institucional.</span></div>
<div id="sub-g5" class="cap clip" data-start="24.3" data-duration="5.13"><span>Tiene la forma nombre, punto, apellido, arroba, ciencias e ingeniería,</span></div>
<div id="sub-g6" class="cap clip" data-start="29.45" data-duration="4.62"><span>punto edu. Luego escribe tu contraseña.</span></div>
<div id="sub-g7" class="cap clip" data-start="35.59" data-duration="3.46"><span>Si quieres revisar lo que escribiste, pulsa el ícono del ojo:</span></div>
<div id="sub-g8" class="cap clip" data-start="39.07" data-duration="2.79"><span>Mostrar contraseña.</span></div>
<div id="sub-g9" class="cap clip" data-start="43.38" data-duration="3.17"><span>La primera vez entrarás con una contraseña temporal que te entrega la</span></div>
<div id="sub-g10" class="cap clip" data-start="46.57" data-duration="3.84"><span>administración. El sistema te pedirá crear una nueva,</span></div>
<div id="sub-g11" class="cap clip" data-start="50.43" data-duration="3.46"><span>de al menos doce caracteres. Al cambiarla,</span></div>
<div id="sub-g12" class="cap clip" data-start="53.91" data-duration="3.76"><span>se cierran tus otras sesiones abiertas.</span></div>
<div id="sub-g13" class="cap clip" data-start="59.19" data-duration="6.44"><span>Si ves el mensaje: Credenciales inválidas, revisa tu usuario y tu contraseña.</span></div>
<div id="sub-g14" class="cap clip" data-start="68.05" data-duration="3.04"><span>En la computadora, el menú está a la izquierda.</span></div>
<div id="sub-g15" class="cap clip" data-start="71.59" data-duration="4.12"><span>La marca roja te indica en qué sección estás.</span></div>
<div id="sub-g16" class="cap clip" data-start="77.23" data-duration="3.11"><span>Arriba tienes el tema claro u oscuro, tu perfil,</span></div>
<div id="sub-g17" class="cap clip" data-start="80.36" data-duration="4.41"><span>el calendario y el año escolar. Vigente es el año en curso;</span></div>
<div id="sub-g18" class="cap clip" data-start="84.79" data-duration="5.84"><span>Histórico es un año anterior. Pulsa Cambiar para elegir otro.</span></div>
<div id="sub-g19" class="cap clip" data-start="92.15" data-duration="2.37"><span>En el celular, usa la barra de abajo:</span></div>
<div id="sub-g20" class="cap clip" data-start="94.54" data-duration="7.72"><span>Inicio, Módulos, Horarios, Notas y Perfil. En Módulos están todos los accesos.</span></div>
<div id="sub-g21" class="cap clip" data-start="103.79" data-duration="6.94"><span>En las listas, cada registro es una tarjeta. Tócala para ver los detalles.</span></div>
<div id="sub-g22" class="cap clip" data-start="112.25" data-duration="4.64"><span>En Mi perfil ves tus datos y puedes cambiar tu contraseña.</span></div>
<div id="sub-g23" class="cap clip" data-start="118.91" data-duration="2.83"><span>Si eres administrador, gestionas las cuentas,</span></div>
<div id="sub-g24" class="cap clip" data-start="121.76" data-duration="3.52"><span>la institución y el año académico.</span></div>
<div id="sub-g25" class="cap clip" data-start="128.4" data-duration="3.58"><span>En Usuarios, pulsa Nuevo usuario para crear una cuenta.</span></div>
<div id="sub-g26" class="cap clip" data-start="132.49" data-duration="5.18"><span>El sistema genera el usuario institucional y una contraseña temporal.</span></div>
<div id="sub-g27" class="cap clip" data-start="139.19" data-duration="5.29"><span>Entrégala de forma segura: en persona o por un canal privado.</span></div>
<div id="sub-g28" class="cap clip" data-start="146" data-duration="3.69"><span>En Institución están Alumnos, Profesores y Apoderados.</span></div>
<div id="sub-g29" class="cap clip" data-start="150.2" data-duration="2.99"><span>En Apoderados ves los alumnos a cargo de cada uno,</span></div>
<div id="sub-g30" class="cap clip" data-start="153.21" data-duration="3.62"><span>y con el botón Alumnos los vinculas.</span></div>
<div id="sub-g31" class="cap clip" data-start="158.35" data-duration="1.9"><span>En Académico organizas el año:</span></div>
<div id="sub-g32" class="cap clip" data-start="160.27" data-duration="4.67"><span>Periodos, y Estructura académica, donde defines los grados de cada periodo,</span></div>
<div id="sub-g33" class="cap clip" data-start="164.96" data-duration="6.81"><span>los cursos de cada grado y sus docentes. Además, Cursos y Horarios.</span></div>
<div id="sub-g34" class="cap clip" data-start="173.29" data-duration="6.18"><span>También registras Matrículas y Pagos: mensualidades, matrícula y sueldos.</span></div>
<div id="sub-g35" class="cap clip" data-start="180.99" data-duration="3.96"><span>Y manejas Documentos y formularios, revisas Alertas y Reportes,</span></div>
<div id="sub-g36" class="cap clip" data-start="184.97" data-duration="3.49"><span>y publicas eventos en el Calendario.</span></div>
<div id="sub-g37" class="cap clip" data-start="190.48" data-duration="5.6"><span>Si eres profesor, solo ves tus cursos y tus alumnos asignados.</span></div>
<div id="sub-g38" class="cap clip" data-start="199.2" data-duration="5.19"><span>En el menú encuentras Mis cursos, Mis alumnos y Mis horarios.</span></div>
<div id="sub-g39" class="cap clip" data-start="205.91" data-duration="5.19"><span>En Calificaciones, elige un curso y crea una evaluación.</span></div>
<div id="sub-g40" class="cap clip" data-start="212.62" data-duration="3.44"><span>Luego registra la nota de cada alumno, de cero a veinte,</span></div>
<div id="sub-g41" class="cap clip" data-start="216.08" data-duration="3.08"><span>y pulsa Guardar notas.</span></div>
<div id="sub-g42" class="cap clip" data-start="220.68" data-duration="3.51"><span>En Asistencia, elige la fecha y marca a cada alumno:</span></div>
<div id="sub-g43" class="cap clip" data-start="224.21" data-duration="4.66"><span>presente, tardanza, ausente o justificado.</span></div>
<div id="sub-g44" class="cap clip" data-start="230.39" data-duration="6.94"><span>Si el año elegido es Histórico, solo puedes consultar. No se puede editar.</span></div>
<div id="sub-g45" class="cap clip" data-start="238.86" data-duration="4.02"><span>También ves las alertas de tus alumnos, los apoderados de tus alumnos,</span></div>
<div id="sub-g46" class="cap clip" data-start="242.9" data-duration="3.77"><span>el calendario y tus notificaciones.</span></div>
<div id="sub-g47" class="cap clip" data-start="248.69" data-duration="4.62"><span>Si eres alumno, consultas tu propia información.</span></div>
<div id="sub-g48" class="cap clip" data-start="256.43" data-duration="3.35"><span>Desde Mi panel entras a Mis cursos, Mis calificaciones,</span></div>
<div id="sub-g49" class="cap clip" data-start="259.8" data-duration="3.38"><span>Mi asistencia y Mis horarios.</span></div>
<div id="sub-g50" class="cap clip" data-start="264.7" data-duration="6.18"><span>También tienes el Calendario, Mis pagos, Mis alertas y Mis notificaciones.</span></div>
<div id="sub-g51" class="cap clip" data-start="272.9" data-duration="6.01"><span>Si eres padre de familia o apoderado, consultas la información de tus hijos.</span></div>
<div id="sub-g52" class="cap clip" data-start="282.03" data-duration="4.35"><span>Entra a Estudiantes a mi cargo y elige al estudiante.</span></div>
<div id="sub-g53" class="cap clip" data-start="287.9" data-duration="5.72"><span>Verás su Resumen, Cursos y horarios, Calificaciones y Asistencia.</span></div>
<div id="sub-g54" class="cap clip" data-start="295.14" data-duration="5.24"><span>Desde Mi perfil, en Seguridad, puedes cambiar tu contraseña.</span></div>
<div id="sub-g55" class="cap clip" data-start="302.8" data-duration="4.57"><span>No compartas tu contraseña. Si usas una computadora compartida,</span></div>
<div id="sub-g56" class="cap clip" data-start="307.39" data-duration="3.36"><span>pulsa Cerrar sesión al terminar.</span></div>
<div id="sub-g57" class="cap clip" data-start="312.27" data-duration="5.67"><span>Si tienes dudas o ves un dato incorrecto, comunícate con la administración.</span></div>
<div id="sub-g58" class="cap clip" data-start="319.46" data-duration="4.59"><span>Listo. Ya puedes usar el sistema.</span></div>
</div>
